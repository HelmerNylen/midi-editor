<!doctype html>
<html>
  <head>
    <title>MIDI Editor</title>

    <link rel="stylesheet" type="text/css" href="style.css" />

    <script type="module" src="js/editor.js"></script>
    <script type="module">
      import {Editor} from './js/editor.js';
      let editor;
      window.addEventListener('load', async () => {
        editor = new Editor();
      });
    </script>
  </head>
  <body>
    <div class="topBar">
      <button id="setupMidi">Set up MIDI</button>
      <button id="midiUpload">Load</button>
      <select id="input"></select>
      <select id="output"></select>
      <select id="waveform"></select>
      <select id="melody"></select>
      <button id="play">Play</button>
    </div>
    <div>
      <canvas id="noteCanvas" class="noteCanvas"></canvas>
    </div>
    <input
      id="midiUploadInput"
      class="hidden"
      type="file"
      accept=".mid,.midi,audio/midi" />
  </body>
</html>
