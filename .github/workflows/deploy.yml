name: Deploy page
run-name: Deploying page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.html'
      - '**.css'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          npm i --g typescript
          npm i
      - name: Build
        run: tsc
      - name: Move to output folder
        run: |
          mkdir out
          cp -r js/ out/
          cp -r ts/ out/
          cp *.{html,css} out/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      
